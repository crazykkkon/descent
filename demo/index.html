<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>坠井者 · 试玩版</title>
<style>
  :root {
    --bg: #0a1014; --panel: #121c22; --line: #24343d; --text: #d7e3e8; --dim: #7d939c;
    --hp: #e0566b; --atk: #e8925a; --def: #5aa6e8; --key: #d9c27a; --gold: #f0c94a; --accent: #5fd0b5;
    --font: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05080a; color: var(--text); font-family: var(--font); overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }

  /* 16:9 横屏画布，按屏幕等比缩放；--u = 画布高度的 1% */
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--bg);
           display: grid; grid-template-columns: 1fr calc(var(--u) * 42); grid-template-rows: calc(var(--u) * 11) 1fr;
           gap: calc(var(--u) * 2); padding: calc(var(--u) * 2.5); }

  /* 顶部状态栏 */
  #hud { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: calc(var(--u) * 3); background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.5); padding: 0 calc(var(--u) * 3); }
  #hud .title { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
  #hud .name { font-size: calc(var(--u) * 3.8); font-weight: bold; color: var(--accent); white-space: nowrap; }
  #hud .sub { font-size: calc(var(--u) * 2.3); color: var(--dim); white-space: nowrap; }
  .stat { display: flex; align-items: center; gap: calc(var(--u) * 1); }
  .stat .ico { width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); border-radius: calc(var(--u) * 0.8); display: grid; place-items: center; font-size: calc(var(--u) * 2.6); font-weight: bold; color: #0a1014; }
  .stat .val { font-size: calc(var(--u) * 4); font-weight: bold; font-variant-numeric: tabular-nums; min-width: calc(var(--u) * 5); }
  .stat .val.bump { animation: bump .35s; }
  @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .stat.steps .val { font-size: calc(var(--u) * 3); color: var(--dim); }

  /* 地图 */
  #boardWrap { grid-column: 1; grid-row: 2; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #board { display: grid; gap: calc(var(--u) * 0.5); background: #071014; padding: calc(var(--u) * 0.8); border-radius: calc(var(--u) * 1.5); border: 1px solid var(--line); }
  .cell { position: relative; border-radius: calc(var(--u) * 0.8); display: grid; place-items: center; cursor: pointer; font-weight: bold; overflow: hidden; }
  .cell:hover { outline: 2px solid #ffffff50; }
  .cell.sel { outline: 3px solid var(--accent); z-index: 1; }
  .cell.floor { background: #1a272e; }
  .cell.wall { background: #0c1418; cursor: default; background-image: repeating-linear-gradient(45deg, #0f191e 0 6px, #0b1316 6px 12px); }
  .cell.wall:hover { outline: none; }
  .cell .glyph { font-size: calc(var(--cell) * 0.36); line-height: 1; }
  .cell .sub { position: absolute; bottom: 5%; left: 0; right: 0; text-align: center; font-size: calc(var(--cell) * 0.2); font-weight: bold; }
  .cell.monster { background: #3a1e26; color: #ffd6dc; }
  .cell.monster.elite { background: #5a2330; }
  .cell.monster .glyph, .cell.door .glyph { margin-top: -18%; font-size: calc(var(--cell) * 0.3); }
  .cell.monster .sub.ok { color: #ffd479; }
  .cell.monster .sub.bad { color: #ff4d6a; }
  .cell.item { background: #1d2b24; }
  .cell.door { background: #3b2f1c; color: #f2d79b; }
  .cell.door.blood { background: #4a1820; color: #ff9aa8; }
  .cell.exit { background: #133a33; color: #8ff0d6; }
  .cell.exit.locked { background: #23302d; color: #5d7a73; }
  #board { position: relative; }
  #hero { position: absolute; left: 0; top: 0; display: grid; place-items: center; pointer-events: none; z-index: 3; will-change: transform; }
  .heroToken { height: 88%; max-width: 100%; object-fit: contain; image-rendering: pixelated; }
  #hero[data-facing="left"] .heroToken { scale: -1 1; }
  .gem { width: 50%; height: 50%; transform: rotate(45deg); border-radius: 18%; }
  .gem.red { background: linear-gradient(135deg, #ffb08a, #e2553a); box-shadow: 0 0 calc(var(--u) * 1.5) #e2553a90; }
  .gem.blue { background: linear-gradient(135deg, #a8dcff, #2f7fd6); box-shadow: 0 0 calc(var(--u) * 1.5) #2f7fd690; }
  .potion { width: 44%; height: 54%; border-radius: 40% 40% 45% 45%; background: linear-gradient(#ff8a9b, #c8304a); position: relative; }
  .potion.big { width: 58%; height: 68%; }
  .potion::before { content: ''; position: absolute; top: -18%; left: 32%; width: 36%; height: 22%; background: #9fb3ba; border-radius: 2px; }

  /* 战斗预览气泡（贴在怪物格子上方） */
  #tip { position: absolute; pointer-events: none; z-index: 6; display: none; transform: translate(-50%, -100%); background: #0d1519f0; border: 1px solid #3c5560; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 0.8) calc(var(--u) * 1.6); font-size: calc(var(--u) * 2.8); white-space: nowrap; box-shadow: 0 4px 14px #000a; }
  #tip b { color: #ff7a8c; }
  #tip .after { color: var(--accent); font-weight: bold; }
  #tip .after.dead { color: #ff4d6a; }
  .float { position: absolute; pointer-events: none; font-weight: bold; font-size: calc(var(--u) * 3.6); animation: floatUp .9s forwards; z-index: 5; text-shadow: 0 2px 4px #000; transform: translateX(-50%); }
  @keyframes floatUp { from { opacity: 1; } to { opacity: 0; margin-top: calc(var(--u) * -7); } }

  /* 右栏 */
  #side { grid-column: 2; grid-row: 1 / 3; background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.5); padding: calc(var(--u) * 3); display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); min-height: 0; }
  #infoTitle { font-size: calc(var(--u) * 4); font-weight: bold; }
  #infoLines { font-size: calc(var(--u) * 2.7); line-height: 1.6; }
  #infoLines .warn { color: var(--hp); font-weight: bold; }
  .preview { background: #0d1519; border: 1px solid var(--line); border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1.6); display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 0.6) calc(var(--u) * 2); }
  .preview .k { font-size: calc(var(--u) * 2.3); color: var(--dim); }
  .preview .v { font-size: calc(var(--u) * 4.4); font-weight: bold; font-variant-numeric: tabular-nums; }
  .preview .v.lose { color: #ff7a8c; }
  .preview .v.left { color: var(--accent); }
  .preview .v.dead { color: #ff4d6a; }
  #confirm { display: none; }
  .preview .k.gold { grid-column: 1 / -1; color: var(--gold); }
  #tip .goldTip { color: var(--gold); font-size: calc(var(--u) * 2.3); }
  #hero.dead .heroToken { filter: grayscale(1) brightness(.6); transform: rotate(90deg); transition: transform .4s, filter .4s; }
  .intel { background: #1a1608; border: 1px solid #6b5a22; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1.4) calc(var(--u) * 1.8); font-size: calc(var(--u) * 2.5); line-height: 1.6; color: #e8dcb0; }
  .intel b { display: block; color: #ffd479; font-size: calc(var(--u) * 2.9); margin-bottom: calc(var(--u) * 0.4); }
  .contract { background: #10161c; border: 1px solid #4b6b7a; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1.4) calc(var(--u) * 1.8); font-size: calc(var(--u) * 2.6); line-height: 1.7; margin-top: calc(var(--u) * 1); }
  .contractHead { color: #9fd3e6; font-weight: bold; margin-bottom: calc(var(--u) * 0.5); }
  .contractRow span { display: inline-block; width: calc(var(--u) * 3.6); color: #6f8c99; }
  .contractRow b { color: #e6f3f8; }
  .warnText { color: #ff6b81; }
  #contractBox { display: none; font-size: calc(var(--u) * 2.5); line-height: 1.5; color: #cfeaf3; background: #12232b; border: 1px solid #3e6878; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1.2); }
  #contractBox.broken { color: #ffc2cb; background: #2a161b; border-color: #7a2a38; }
  #modal .row.contractOk b { color: var(--accent); }
  #modal .row.contractBad b { color: #ff6b81; }
  .weaponChip { font-size: calc(var(--u) * 2.6); color: #ffd9b0; background: #2a1d12; border: 1px solid #6b4a22; border-radius: calc(var(--u) * 0.8); padding: calc(var(--u) * 0.6) calc(var(--u) * 1.2); white-space: nowrap; }
  .weaponChip.bump { animation: bump .35s; }
  .cell.slot { background: #2b2140; color: #e6d4ff; cursor: pointer; box-shadow: inset 0 0 0 2px #6d4fa8; }
  .cell.slot.risky { background: #3a1f33; box-shadow: inset 0 0 0 2px #a84f8a; }
  .cell.slot .glyph { margin-top: -18%; font-size: calc(var(--cell) * 0.3); }
  .strips { display: flex; gap: calc(var(--u) * 1.5); justify-content: center; }
  .strip { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.4); background: #0d1519; border: 1px solid var(--line); border-radius: calc(var(--u) * 0.8); padding: calc(var(--u) * 0.8); }
  .stripHead { font-size: calc(var(--u) * 2); color: var(--dim); }
  .strip { flex-direction: row; flex-wrap: wrap; width: calc(var(--u) * 21); justify-content: center; }
  .stripHead { width: 100%; text-align: center; }
  .sym { display: inline-grid; place-items: center; border-radius: calc(var(--u) * 0.6); font-weight: bold; color: #0a1014; }
  .sym.mini { width: calc(var(--u) * 4); height: calc(var(--u) * 4); font-size: calc(var(--u) * 2.2); }
  .sym.big { width: calc(var(--u) * 8); height: calc(var(--u) * 8); font-size: calc(var(--u) * 4.2); }
  .sym.s-blade { background: #e8925a; } .sym.s-hammer { background: #e0b25a; } .sym.s-harpoon { background: #5ac8e0; }
  .sym.s-potion { background: #e0566b; } .sym.s-coin { background: #f0c94a; } .sym.s-leech { background: #6b4a8a; color: #f2e6ff; }
  .reels { display: flex; gap: calc(var(--u) * 2); justify-content: center; min-height: calc(var(--u) * 14); align-items: center; }
  .reel { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.6); background: #10161c; border: 2px solid var(--line); padding: calc(var(--u) * 1); }
  .reel.held { border-color: var(--accent); background: #12302a; }
  .reel.bit { border-color: #a03a4c; }
  .reel .lock { font-size: calc(var(--u) * 2); color: var(--dim); }
  .reels.spinning .sym { filter: blur(1px); }
  .payout { font-size: calc(var(--u) * 2.8); color: var(--accent); text-align: center; }
  #modal .box { max-height: 96%; overflow-y: auto; }
  #modal .box.slotBox { width: calc(var(--u) * 150); padding: calc(var(--u) * 3) calc(var(--u) * 4); }
  .slotGrid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 3); align-items: start; }
  .slotLeft, .slotRight { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
  .slotLeft .strips { flex-direction: column; align-items: stretch; }
  .slotLeft .strip { width: auto; flex-wrap: nowrap; justify-content: flex-start; gap: calc(var(--u) * 0.5); }
  .slotLeft .stripHead { width: calc(var(--u) * 8); text-align: left; }
  .rules { line-height: 1.7; }
  .holdHint { font-size: calc(var(--u) * 2.6); color: #cfeaf3; background: #12232b; border: 1px solid #3e6878; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1); }
  .intelHead { font-size: calc(var(--u) * 2.2); color: #b8a46a; }
  #msg { font-size: calc(var(--u) * 2.6); min-height: calc(var(--u) * 7); line-height: 1.5; }
  #msg.err { color: var(--hp); }
  #danger { display: none; font-size: calc(var(--u) * 2.5); color: #ffb0b8; background: #3a1820; border: 1px solid #7a2a38; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1.2); }
  .sep { height: 1px; background: var(--line); flex: none; }
  .grow { flex: 1; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.2); }
  button { font-family: var(--font); font-size: calc(var(--u) * 2.8); padding: calc(var(--u) * 1.5) calc(var(--u) * 1); border-radius: calc(var(--u) * 1); border: 1px solid var(--line); background: #1c2a31; color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { background: #26414a; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #1f5a4d; border-color: #2f8a74; }
  button.danger { background: #5a1f2a; border-color: #8a2f40; }
  button.wide { grid-column: 1 / -1; }
  .keys { font-size: calc(var(--u) * 2.1); color: var(--dim); line-height: 1.5; }

  /* 弹窗 */
  #modal { position: absolute; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 4) calc(var(--u) * 5); width: calc(var(--u) * 84); display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
  #modal h2 { margin: 0; font-size: calc(var(--u) * 5); color: var(--accent); }
  #modal .row { display: flex; justify-content: space-between; font-size: calc(var(--u) * 3.2); }
  #modal .row b { color: var(--gold); }
  #modal p { margin: 0; font-size: calc(var(--u) * 2.9); line-height: 1.6; }
  #modal .small { font-size: calc(var(--u) * 2.5); color: var(--dim); }

  /* 竖屏提示 */
  #rotate { position: fixed; inset: 0; background: #05080a; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; font-size: 20px; z-index: 100; text-align: center; padding: 24px; }
  #rotate .phone { width: 60px; height: 100px; border: 4px solid var(--accent); border-radius: 12px; animation: rot 2s infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="stage">
  <div id="hud"></div>
  <div id="boardWrap"><div id="board"></div><div id="tip"></div></div>
  <div id="side">
    <div id="infoTitle"></div>
    <div id="infoLines"></div>
    <button id="confirm" class="primary">出手</button>
    <div id="contractBox"></div>
    <div id="danger"></div>
    <div class="sep"></div>
    <div id="msg"></div>
    <div class="grow"></div>
    <div class="btns">
      <button id="newRun" class="wide">新开一局（换地图）</button>
    </div>
    <div class="keys" id="keysHint"></div>
  </div>
  <div id="modal"><div class="box" id="modalBox"></div></div>
</div>
<div id="rotate"><div class="phone"></div><div>请把手机横过来玩</div></div>
<script>
"use strict";
(() => {
  // src/core/config.ts
  var TRAIT_NAMES = {
    firstStrike: "\u5148\u653B",
    lifesteal: "\u5438\u8840",
    thorns: "\u53CD\u4F24",
    double: "\u4E8C\u8FDE\u51FB",
    swarm: "\u7FA4\u5C45",
    corrode: "\u8150\u8680",
    shelter: "\u5E87\u62A4"
  };
  var TRAIT_DESC = {
    firstStrike: "\u6218\u6597\u5F00\u59CB\u65F6\u5B83\u5148\u6253\u4E00\u6B21",
    lifesteal: "\u6BCF\u6B21\u547D\u4E2D\uFF0C\u56DE\u590D\u9020\u6210\u4F24\u5BB3\u7684\u4E00\u534A",
    thorns: "\u4F60\u6BCF\u6B21\u653B\u51FB\uFF0C\u81EA\u5DF1\u53D7\u5230 3 \u70B9\u4F24\u5BB3",
    double: "\u6BCF\u56DE\u5408\u653B\u51FB\u4E24\u6B21",
    swarm: "\u6BCF\u6709\u4E00\u53EA\u76F8\u90BB\u7684\u540C\u7C7B\uFF0C\u653B\u51FB +5",
    corrode: "\u6BCF\u6B21\u547D\u4E2D\uFF0C\u4F60\u5728\u8FD9\u573A\u6218\u6597\u91CC\u7684\u9632\u5FA1 \u22121",
    shelter: "\u76F8\u90BB\u7684\u5176\u4ED6\u602A\u7269\u9632\u5FA1 +6\uFF08\u51E0\u53EA\u796D\u53F8\u56F4\u7740\u4E5F\u53EA\u52A0\u4E00\u6B21\uFF09"
  };
  var THORNS_DAMAGE = 3;
  var SWARM_ATK = 5;
  var CORRODE_DEF = 1;
  var SHELTER_DEF = 6;
  var MONSTERS = {
    moss: { id: "moss", name: "\u4E95\u82D4", hp: 30, atk: 15, def: 2, traits: [], gold: 3 },
    eel: { id: "eel", name: "\u76F2\u9CD7", hp: 45, atk: 20, def: 5, traits: [], gold: 6 },
    frog: { id: "frog", name: "\u9AA8\u86D9", hp: 60, atk: 22, def: 8, traits: [], gold: 10 },
    beetle: { id: "beetle", name: "\u9508\u7532\u866B", hp: 40, atk: 18, def: 14, traits: [], gold: 9 },
    bat: { id: "bat", name: "\u56DE\u58F0\u8760", hp: 35, atk: 25, def: 6, traits: ["firstStrike"], gold: 9 },
    wraith: { id: "wraith", name: "\u6EBA\u9B42", hp: 80, atk: 28, def: 10, traits: ["lifesteal"], gold: 16 },
    crab: { id: "crab", name: "\u88C2\u5CA9\u87F9", hp: 70, atk: 30, def: 12, traits: ["thorns"], gold: 16 },
    guardian: { id: "guardian", name: "\u77F3\u9CDE\u5B88\u536B", hp: 90, atk: 26, def: 14, traits: ["double"], elite: true, gold: 50 },
    // 下面四只的数值来自原设计方案第 4 章（层位和最终数值是讨论项，二十层平衡时再调）
    rat: { id: "rat", name: "\u4E95\u9F20", hp: 40, atk: 34, def: 14, traits: ["swarm"], gold: 8 },
    slug: { id: "slug", name: "\u76D0\u8680\u86DE\u8753", hp: 90, atk: 38, def: 18, traits: ["corrode"], gold: 14 },
    priest: { id: "priest", name: "\u9AB8\u9AA8\u796D\u53F8", hp: 100, atk: 30, def: 22, traits: ["shelter"], gold: 16 },
    gatekeeper: { id: "gatekeeper", name: "\u5B88\u95E8\u4EBA", hp: 160, atk: 44, def: 24, traits: ["double"], elite: true, gold: 80 },
    // 第 20 层 Boss 的占位：回合制站位战（召唤、落石、危区）还没做，先用一场确定的战斗代替
    eye: { id: "eye", name: "\u4E95\u5E95\u4E4B\u773C", hp: 360, atk: 60, def: 32, traits: [], elite: true, gold: 0 }
  };
  function monsterInContext(m, adjacent) {
    let atk = m.atk;
    let def = m.def;
    if (m.traits.includes("swarm")) atk += SWARM_ATK * adjacent.filter((id) => id === m.id).length;
    if (adjacent.some((id) => MONSTERS[id].traits.includes("shelter"))) def += SHELTER_DEF;
    return atk === m.atk && def === m.def ? m : { ...m, atk, def };
  }
  var ITEM_NAMES = {
    smallPotion: "\u5C0F\u8840\u74F6",
    bigPotion: "\u5927\u8840\u74F6",
    redGem: "\u8D64\u6676",
    blueGem: "\u9752\u6676",
    key: "\u9AA8\u94A5",
    gold: "\u91D1\u5E01\u888B"
  };
  var WEAPONS = {
    boneKnife: { id: "boneKnife", name: "\u9AA8\u5200", desc: "\u653B\u51FB +4", atk: 4, def: 0, sell: 25 },
    harpoon: { id: "harpoon", name: "\u9C7C\u53C9", desc: "\u6BCF\u573A\u6218\u6597\u5F00\u59CB\u5148\u523A\u4E00\u4E0B\uFF08\u591A\u4E00\u6B21\u653B\u51FB\uFF09", atk: 0, def: 0, firstHit: true, sell: 25 },

    const u = h / 100;

    const pad = u * 0.8 * 2 + 2;

        return { cls: "floor", html: "" };
