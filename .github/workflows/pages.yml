# 把试玩版发布到 GitHub Pages：https://crazykkkon.github.io/descent/
# 每次推送到 main 都会重新打包 demo/index.html 并发布。
# 第一次使用前：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: 发布试玩版

# 断臂转轮版起网页原型不再更新（只做 LÖVE 版），网页上保留最后一次发布的井的契约版。
# 只能手动触发；需要先把 web/ 改到新规则上才能打包成功。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
